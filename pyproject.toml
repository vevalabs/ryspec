[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ryspec"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4"]

[project.scripts]
ryspec = "ryspec:main"

[project.optional-dependencies]
test = ["pytest>=8", "tree-sitter>=0.23"]

# The package is a binding over the C library, so installing it compiles one:
# setup.py builds src/*.c and the vendored tree-sitter runtime into
# ryspec/libryspec.so, which means a C compiler at install time and a
# platform-specific wheel out of it.
#
# The Python package is one subproject of a repository whose root is the C
# parser: src/ at the root is the generated parser, and the package lives at
# python/src/ryspec.
[tool.setuptools]
package-dir = { "" = "python/src" }

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
ryspec = ["schemas/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/src"]

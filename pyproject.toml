[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ryspec"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4"]

[project.scripts]
ryspec = "ryspec:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.package-data]
ryspec = ["schemas/**.json"]

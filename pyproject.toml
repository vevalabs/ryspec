[build-system]
requires = ["py-build-cmake~=0.5.1"]
build-backend = "py_build_cmake.build"

[project]
name = "ryspec"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4"]
license = "MPL-2.0"
license-files = ["LICENSE"]

[project.scripts]
ryspec = "ryspec:main"

[project.optional-dependencies]
test = ["pytest>=8", "tree-sitter>=0.23"]

# The package is a binding over the C library, so installing it compiles one --
# and compiles it the way this repository does, by running CMakeLists.txt.
# py-build-cmake is that: `pip install .` configures, builds and installs the
# same build system `make` drives, and what CMake's install rules put in the
# staging directory is what the wheel holds. So there is one description of how
# the C is built, rather than a second one in a setup.py that could compile
# something subtly different.
#
# The price is a C compiler and CMake at install time, the network for the
# tree-sitter runtime CMakeLists.txt fetches, and a platform-specific wheel out
# of it. A build with no network passes CMake a runtime already on disk:
#
#   pip install . \
#     -C override=cmake.options.FETCHCONTENT_FULLY_DISCONNECTED=ON \
#     -C override=cmake.options.FETCHCONTENT_SOURCE_DIR_TREE-SITTER=/path/to/tree-sitter
#
# The Python package is one subproject of a repository whose root is the C
# parser: src/ at the root is the generated parser, and the package is
# python/src/ryspec.
[tool.py-build-cmake.module]
name = "ryspec"
directory = "python/src"

[tool.py-build-cmake.sdist]
# What `pip install` off the sdist compiles, and the prose that explains it.
# The applications, the corpus and the grammar tests are the repository's, not
# the package's -- CMakeLists.txt stops before them here.
include = [
  "CMakeLists.txt",
  "src/**",
  "schemas/**",
  "README.md",
  "AGENTS.md",
  "DESIGN.md",
  "VERSIONING.md",
]

[tool.py-build-cmake.cmake]
minimum_version = "3.25"
build_type = "Release"
# Beside build/, the tree `make` drives, rather than in a dot-directory of its
# own; keyed by interpreter and platform, as the backend's own default is.
build_path = "build/wheel/{build_config}"

[tool.py-build-cmake.cmake.options]
# The one thing that differs from `make`: build the library, install it into
# the package, and stop there.
RYSPEC_PYTHON_MODULE = "ON"

[tool.py-build-cmake.wheel]
# libryspec.so holds no PyInit_ and touches no Python C API -- ryspec.semantics
# opens it with ctypes. So the wheel is specific to the platform and not to the
# interpreter: one build serves every Python this package supports, and
# requires-python above is what holds the floor.
python_tag = ["py3"]
python_abi = "none"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/src"]

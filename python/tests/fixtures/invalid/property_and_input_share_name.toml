#:schema ../../../../schemas/v0/ryspec.schema.json
version = 0

# Rule 11, property and input: a property verdict is a value of its own, so
# 'guard' would name both the verdict and the input the verdict reads. The
# published 'seen_guard' beside it is the shared name that is allowed.

[monitor]
inputs = ["p", "guard"]
outputs = ["seen_guard"]

[variables]
p = { type = "bool" }
guard = { type = "bool" }

[rules]
seen_guard = ["once", "guard"]

[[properties]]
name = "guard"
check = ["and", "p", "guard"]

#:schema ../../../../schemas/v0/ryspec.schema.json
version = 0

# Rule 11, two rules: [properties.rules] is a boundary between properties, not
# a shadow over [rules]. A private 'helper' beside a file-level one leaves the
# name ambiguous inside the property that declares it.

[monitor]
inputs = ["p"]
outputs = ["helper_holds"]

[variables]
p = { type = "bool" }

[rules]
helper = ["once", "p"]

[[properties]]
name = "helper_holds"
check = "helper"

[properties.rules]
helper = ["always", "p"]

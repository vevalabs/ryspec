#:schema ../schemas/v0/ryspec.schema.json
version = "0"

# forall and exists quantify a rule over values rather than over time. Each
# binds names local to itself -- declared in no table, taking no slot -- and
# ranges them over the active domain: the values that position has carried in
# the trace so far.
[[monitors]]
inputs = ["sensor_id", "reading"]
# `every_sensor_in_band` is a rule, so it is not named here. `band_holds` is
# the property that reads it, and its verdict is what the monitor publishes.
outputs = ["band_holds"]

[variables]
sensor_id = { type = "number" }
reading = { type = "number" }

[rules]
# Of the sensor ids seen so far, every one has read under the limit. The
# binding table sits where a metric bound sits, and `qvars` is its only key.
every_sensor_in_band = [
  "forall",
  ["implies", ["assign", "sensor_id", { qvar = "s" }], ["lt", "reading", { value = 120 }]],
  { qvars = ["s"] },
]

[properties.band_holds]
check = "every_sensor_in_band"

[properties.some_sensor_reported_twice]
# The same shape in expression form: the bound names in brackets, then the
# rule they range over. `{a := sensor_id}` is the assignment, the bound name on
# the left.
check = "(exists[a] ({a := sensor_id} and (once {a := sensor_id})))"

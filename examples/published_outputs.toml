#:schema ../schemas/v0/ryspec.schema.json
version = "0"

# An output names the value it publishes, and there are two ways to name one:
# a property, whose verdict is published, or a variable the document computes
# rather than reads -- `speed` below, decoded out of the frame and claiming no
# input slot of its own. A property takes the dotted form <namespace>.<name>,
# bare in the anonymous namespace; a variable is always bare, since the value
# space has no namespaces.
#
# A rule is named in neither list. `once_moving` and `guard` are how
# `guard_holds` is written, and `rhs` is private to that property; publishing
# what one of them computes means giving it a property of its own.
[monitors.default]
inputs = ["frame", "r"]
outputs = ["guard_holds", "speed"]

[variables]
frame = { type = "text", format = "json", description = "telemetry frame" }
r = { type = "bool" }
speed = { source = "frame.vehicle.speed", type = "number", description = "the decoded speed" }

[rules]
once_moving = ["once", ["gt", "speed", { value = 0 }]]
guard = ["and", ["and", "r", ["not", ["gt", "speed", { value = 0 }]]], "once_moving"]

[properties.guard_holds]
check = ["and", "guard", "rhs"]

# `rhs` is private to this property -- another property may declare its own.
# Neither the boundary nor a move up to [rules] makes it publishable: what the
# interface offers is verdicts and variables.
[properties.guard_holds.where]
rhs = ["or", ["gt", "speed", { value = 0 }], "r"]

#:schema ../schemas/v0/ryspec.schema.json
version = "0"

# Prefix form represents a rule as an operator followed by its operands, with
# no infix syntax or precedence rules. `[<ns>.properties.<name>.where]` holds
# subformulas private to this property.
[properties.p1]
given = "cond1"
check = ["since", "not_p", "q"]

[properties.p1.where]
cond1 = ["once", "q", { min = 3, max = 10 }]
not_p = ["not", "p"]

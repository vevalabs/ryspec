#:schema ../schemas/v0/ryspec.schema.json

# Prefix form represents a rule as an operator followed by its operands, with
# no infix syntax or precedence rules. `[properties.rules]` holds subformulas
# private to this property.
[[properties]]
name = "p1"
given = "cond1"
check = ["since", "not_p", "q"]

[properties.rules]
cond1 = ["once", "q", { min = 3, max = 10 }]
not_p = ["not", "p"]

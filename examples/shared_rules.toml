#:schema ../schemas/v0/ryspec.schema.json
version = 0

# File-level rules are named subformulas shared across properties, useful for
# repeated temporal patterns or common domain conditions.
[rules]
subexpr1 = "(once[:10] {q})"
subexpr2 = "(not {p})"
subexpr3 = "(always {r})"

[[properties]]
name = "property1"
given = "subexpr1"
check = "({subexpr2} and {subexpr3})"

[[properties]]
name = "property2"
given = "({subexpr1} and {subexpr2})"
check = "subexpr3"

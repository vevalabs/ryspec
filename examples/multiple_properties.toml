#:schema ../schemas/v0/ryspec.schema.json

# Each property is evaluated independently while sharing the signals
# referenced by its formula.
[features]
allow_expressions = true

[[properties]]
name = "my_property"
check = "({s} -> once[3:10] {p})"

[[properties]]
name = "other_property"
check = "((once[:10] {q}) -> ((not {p}) since {q}))"

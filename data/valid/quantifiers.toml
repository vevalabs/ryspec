#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# The two quantifiers, forall and exists, in both spellings. Each binds names
# that are local to it -- declared nowhere, resolving to nothing -- and ranges
# them over the values the trace has carried so far. A quantifier carries no
# time direction of its own, so it stands in either cone: under a past operator
# in `each_fault_was_seen`, and over a future one in the last property here.
[[monitors]]
inputs = ["sensor_id", "reading", "fault"]
# The quantified rules below are named from no list: a monitor names
# properties and variables, so what the interface carries is the verdicts of
# the properties that read them.
outputs = ["band_holds", "sensors_agree", "disagreement_stays_ahead"]

[variables]
sensor_id = { type = "number", description = "which sensor this sample came from" }
reading = { type = "number" }
fault = { type = "bool" }

[rules]
# One name, ranging over the values `sensor_id` has carried: `assign` holds
# when the binding of `{ qvar = "s" }`, the quantified variable its second
# operand marks, is the value `sensor_id` has now.
every_sensor_in_band = [
  "forall",
  ["implies", ["assign", "sensor_id", { qvar = "s" }], ["lt", "reading", { value = 120 }]],
  { qvars = ["s"] },
]

# Two names at once: sensor `a` reads `b` now, and some other sensor once read
# something else. Each quantified variable is compared with a trace variable,
# never with the other, so a negated `assign` from `sensor_id` is what says the
# sensors differ.
two_sensors_disagreed = [
  "exists",
  [
    "and",
    ["assign", "sensor_id", { qvar = "a" }],
    ["assign", "reading", { qvar = "b" }],
    ["once", ["and", ["not", ["assign", "sensor_id", { qvar = "a" }]], ["not", ["assign", "reading", { qvar = "b" }]]]],
  ],
  { qvars = ["a", "b"] },
]

# One quantifier under another, and the pair under a past operator: a
# quantifier is cone-free, so `once` above it fixes the cone for the whole.
each_fault_was_seen = [
  "once",
  ["forall", ["exists", ["and", ["assign", "sensor_id", { qvar = "s" }], ["not", ["assign", "reading", { qvar = "r" }]]], { qvars = ["r"] }], { qvars = ["s"] }],
  { max = 10 },
]

[properties.band_holds]
message = "a sensor read above the limit"
given = "each_fault_was_seen"
check = "every_sensor_in_band"

[properties.sensors_agree]
check = ["not", "two_sensors_disagreed"]

[properties.written_in_expression_form]
# Expression form: the bound names listed in brackets after the quantifier,
# where a temporal operator writes its bound, and then the rule they range
# over. An assignment is written `{s := sensor_id}`: the bound name on the left
# and the declared variable it ranges over on the right, joined by `:=` so it
# never reads as the comparison `==`. It is `["assign", "sensor_id", { qvar = "s" }]` spelled
# the other way round.
check = "(forall[s] ({s := sensor_id} -> {reading < 120}))"

# The same quantifier over a future operator rather than a past one, which is
# what carrying no direction of its own buys it. Each bound name is assigned
# from a trace variable, never compared with the other.
[properties.disagreement_stays_ahead]
check = "(exists[a, b] (always[:10] ({a := sensor_id} and {b := reading})))"

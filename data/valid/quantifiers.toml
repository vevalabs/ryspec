#:schema ../../schemas/v0/ryspec.schema.json
version = 0

# The two quantifiers, forall and exists, in both spellings. Each binds names
# that are local to it -- declared nowhere, resolving to nothing -- and ranges
# them over the values the trace has carried so far. A quantifier carries no
# time direction of its own, so it stands in either cone: under a past
# operator below, and over a future one in `impose`.
[monitor]
inputs = ["sensor_id", "reading", "fault"]
outputs = ["every_sensor_in_band", "two_sensors_disagreed", "each_fault_was_seen"]

[variables]
sensor_id = { type = "number", description = "which sensor this sample came from" }
reading = { type = "number", unit = "degC" }
fault = { type = "bool" }

[rules]
# Bare, one name, over a comparison.
every_sensor_in_band = [
  "forall",
  ["implies", ["eq", "sensor_id", "s"], ["lt", "reading", 120]],
  { vars = ["s"] },
]

# Two names at once, each standing on either side of a comparison.
two_sensors_disagreed = [
  "exists",
  ["and", ["ne", "a", "b"], ["eq", "sensor_id", "a"], ["once", ["eq", "sensor_id", "b"]]],
  { vars = ["a", "b"] },
]

# One quantifier under another, and the pair under a past operator: a
# quantifier is cone-free, so `once` above it fixes the cone for the whole.
each_fault_was_seen = [
  "once",
  ["forall", ["exists", ["and", ["eq", "sensor_id", "s"], ["ne", "reading", "r"]], { vars = ["r"] }], { vars = ["s"] }],
  { max = 10 },
]

[[properties]]
name = "band_holds"
criticality = "critical"
message = "a sensor read above the limit"
given = "each_fault_was_seen"
check = "every_sensor_in_band"

[[properties]]
name = "sensors_agree"
check = ["not", "two_sensors_disagreed"]

[[properties]]
name = "written_in_expression_form"
# Expression form: names in braces, the bound names listed after the
# quantifier and separated from the rule they bind by a dot.
check = "(forall {s} . (({sensor_id} == {s}) -> ({reading} < 120)))"
impose = "(exists {a}, {b} . (always[:10] (({a} != {b}) and ({sensor_id} == {a}))))"

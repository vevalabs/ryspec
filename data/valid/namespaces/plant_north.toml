#:schema ../../../schemas/v0/ryspec.schema.json
version = "0"

# Half of a pair. This file and `plant_south.toml` beside it declare the same
# local names -- `interlock`, `door_interlock` -- under different namespaces,
# so a tool holding both at once keeps them apart:
# `com.example.plant.north.interlock` is not
# `com.example.plant.south.interlock`, and neither shadows the other.
#
# The namespace is the table the rules and properties sit under, so nothing
# beyond TOML's own nesting says it. What it does not divide is the value
# space: `[variables]` is the document's one table, and a rule in any namespace
# names a variable bare, by the name it is declared under. Each file also stands alone, which is what the rest of
# `data/valid` asks of it.
[[monitors]]
inputs = ["door_open", "arm_moving"]
outputs = ["com.example.plant.north.door_interlock"]

[variables]
door_open = { type = "bool", description = "the cell door is open" }
arm_moving = { type = "bool", description = "the arm is under power" }

[com.example.plant.north.rules]
interlock = ["not", ["and", "door_open", "arm_moving"]]

[com.example.plant.north.properties.door_interlock]
message = "cell door opened while the arm was moving"
check = ["historically", "interlock"]

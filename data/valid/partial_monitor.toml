#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# Every key of a monitor is optional, including the partition lists. This file
# writes `outputs` alone: it says which verdict it publishes and leaves the
# input partition to be deduced, `q` and `r` falling out of first use in the
# order a loader meets them.
[[monitors]]
outputs = ["q_then_r"]

# The second entry says the other half -- an order for the inputs, and nothing
# about what it publishes, so the default set applies: every property in
# declaration order.
[[monitors]]
inputs = ["r", "q"]

[monitors.runtime]
buffer_size = 512

[properties.q_then_r]
check = ["and", "q", ["once", "r"]]

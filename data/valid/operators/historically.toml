#:schema ../../../schemas/v0/ryspec.schema.json
version = "0"

# `historically` holds when its operand held at every point in the past. Its
# optional metric bound narrows how far back that reaches, so a bounded
# `historically` asks only about a window rather than all of history.
#
# Both spellings appear below. Prefix form is an operator followed by its
# operands; expression form is the infix spelling, where an atom is braced and a
# metric bound is written [min:max] after the operator. The two are the same
# rule written two ways, so every prefix rule here has an expression twin.

[monitors.default]
inputs = ["p", "q", "speed"]
outputs = ["historically_prefix", "historically_expression"]
parameters = ["window"]

[variables]
p = { type = "bool" }
q = { type = "bool" }
speed = { type = "number" }
window = { type = "number", initial_value = 20, min = 0, description = "how far the bound reaches" }

[rules]
# Prefix form.
plain = ["historically", "p"]
max_only = ["historically", "p", { max = 10 }]
min_only = ["historically", "p", { min = 3 }]
both_ends = ["historically", "p", { min = 3, max = 10 }]
by_parameter = ["historically", "p", { max = "window" }]
over_boolean = ["historically", ["or", "p", "q"]]
over_comparison = ["historically", ["le", "speed", { value = 30 }]]
over_past = ["historically", ["since", "p", "q"]]
under_past = ["once", ["historically", "p"]]

# Expression form -- the same rules, infix.
expr_plain = "(historically {p})"
expr_max_only = "(historically[:10] {p})"
expr_min_only = "(historically[3:] {p})"
expr_both_ends = "(historically[3:10] {p})"
expr_by_parameter = "(historically[:window] {p})"
expr_over_boolean = "(historically ({p} or {q}))"
expr_over_comparison = "(historically {speed <= 30})"
expr_over_past = "(historically ({p} since {q}))"
expr_under_past = "(once (historically {p}))"

[properties.historically_prefix]
given = "plain"
check = ["and", "max_only", "min_only", "both_ends", "by_parameter", "over_boolean", "over_comparison", "over_past", "under_past"]

# The property itself is written in expression form too: a bare name in `given`
# is a reference and takes no braces, while a name inside an expression does.
[properties.historically_expression]
given = "expr_plain"
check = "({expr_max_only} and {expr_min_only} and {expr_both_ends} and {expr_by_parameter} and {expr_over_boolean} and {expr_over_comparison} and {expr_over_past} and {expr_under_past})"

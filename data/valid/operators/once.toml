#:schema ../../../schemas/v0/ryspec.schema.json
version = 0

# `once` holds when its operand held at some point in the past. Its optional
# metric bound narrows how far back to look and takes either end alone, both
# ends, or a parameter in place of a number.
#
# Both spellings appear below. Prefix form is an operator followed by its
# operands; expression form is the infix spelling, where a name is braced and a
# metric bound is written [min:max] after the operator. The two are the same
# rule written two ways, so every prefix rule here has an expression twin --
# except `over_comparison`, because a comparison has no infix spelling.

[monitor]
inputs = ["p", "q", "speed"]
outputs = ["once_prefix", "once_expression"]
parameters = ["window"]

[variables]
p = { type = "bool" }
q = { type = "bool" }
speed = { type = "number", unit = "m/s" }
window = { initial_value = 20, min = 0, description = "how far the bound reaches" }

[rules]
# Prefix form.
plain = ["once", "p"]
max_only = ["once", "p", { max = 10 }]
min_only = ["once", "p", { min = 3 }]
both_ends = ["once", "p", { min = 3, max = 10 }]
by_parameter = ["once", "p", { max = "window" }]
over_boolean = ["once", ["and", "p", ["not", "q"]]]
over_comparison = ["once", ["gt", "speed", 30]]
over_past = ["once", ["since", "p", "q"]]
under_past = ["historically", ["once", "p"]]

# Expression form -- the same rules, infix.
expr_plain = "(once {p})"
expr_max_only = "(once[:10] {p})"
expr_min_only = "(once[3:] {p})"
expr_both_ends = "(once[3:10] {p})"
expr_by_parameter = "(once[:{window}] {p})"
expr_over_boolean = "(once ({p} and (not {q})))"
expr_over_past = "(once ({p} since {q}))"
expr_under_past = "(historically (once {p}))"

[[properties]]
name = "once_prefix"
given = "plain"
check = ["and", "max_only", "min_only", "both_ends", "by_parameter", "over_boolean", "over_comparison", "over_past", "under_past"]

# The property itself is written in expression form too: a bare name in `given`
# is a reference and takes no braces, while a name inside an expression does.
[[properties]]
name = "once_expression"
given = "expr_plain"
check = "({expr_max_only} and {expr_min_only} and {expr_both_ends} and {expr_by_parameter} and {expr_over_boolean} and {expr_over_past} and {expr_under_past})"

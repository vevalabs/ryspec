#:schema ../../../schemas/v0/ryspec.schema.json
version = "0"

# `eventually` holds when its operand holds at some point in the future -- the
# forward-looking twin of `once`. Its optional metric bound narrows how far
# ahead to look, which is what turns a liveness claim into a deadline.
#
# Both spellings appear below. Prefix form is an operator followed by its
# operands; expression form is the infix spelling, where an atom is braced and a
# metric bound is written [min:max] after the operator. The two are the same
# rule written two ways, so every prefix rule here has an expression twin.

[[monitors]]
inputs = ["p", "q", "speed"]
outputs = ["eventually_prefix", "eventually_expression"]
parameters = ["window"]

[variables]
p = { type = "bool" }
q = { type = "bool" }
speed = { type = "number" }
window = { type = "number", initial_value = 20, min = 0, description = "how far the bound reaches" }

[rules]
# Prefix form.
plain = ["eventually", "p"]
max_only = ["eventually", "p", { max = 10 }]
min_only = ["eventually", "p", { min = 3 }]
both_ends = ["eventually", "p", { min = 3, max = 10 }]
by_parameter = ["eventually", "p", { max = "window" }]
over_boolean = ["eventually", ["and", "p", ["not", "q"]]]
over_comparison = ["eventually", ["gt", "speed", { value = 30 }]]
over_future = ["eventually", ["until", "p", "q"]]
under_future = ["always", ["eventually", "p"]]

# Expression form -- the same rules, infix.
expr_plain = "(eventually {p})"
expr_max_only = "(eventually[:10] {p})"
expr_min_only = "(eventually[3:] {p})"
expr_both_ends = "(eventually[3:10] {p})"
expr_by_parameter = "(eventually[:window] {p})"
expr_over_boolean = "(eventually ({p} and (not {q})))"
expr_over_comparison = "(eventually {speed > 30})"
expr_over_future = "(eventually ({p} until {q}))"
expr_under_future = "(always (eventually {p}))"

[properties.eventually_prefix]
given = "plain"
check = ["and", "max_only", "min_only", "both_ends", "by_parameter", "over_boolean", "over_comparison", "over_future", "under_future"]

# The property itself is written in expression form too: a bare name in `given`
# is a reference and takes no braces, while a name inside an expression does.
[properties.eventually_expression]
given = "expr_plain"
check = "({expr_max_only} and {expr_min_only} and {expr_both_ends} and {expr_by_parameter} and {expr_over_boolean} and {expr_over_comparison} and {expr_over_future} and {expr_under_future})"

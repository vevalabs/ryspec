#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# The smallest document the format admits: a version and one property. There is
# no [monitors] and no [variables], so `heartbeat` can only be an input. With
# no monitor the document offers no interface: `stays_alive` is defined, and
# publishing its verdict is for a monitor to add.
[properties.stays_alive]
check = "heartbeat"

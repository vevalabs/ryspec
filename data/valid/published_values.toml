#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# outputs REPLACES the default published set, which is every property in
# declaration order. Both ways to name a published value appear here: a
# property whose verdict is published, and a declared variable the document
# computes -- `speed`, decoded out of the frame rather than fed in. The names
# property keys bare because this file declares no namespace; under `a.b` it
# would have been `a.b.guard_holds`, and the variable `speed` either way, a
# value space being the document's and carrying no namespace.
#
# The rules are the other half of the point: `guard` at namespace level and
# `rhs` private to the property are what `guard_holds` is built out of, and
# neither is nameable in outputs.
[[monitors]]
inputs = ["frame", "r"]
outputs = ["guard_holds", "speed"]

[variables]
frame = { type = "text", format = "json", description = "telemetry frame" }
r = { type = "bool" }
speed = { source = "frame.vehicle.speed", type = "number", description = "the decoded speed" }

[rules]
moving = ["gt", "speed", { value = 0 }]
r_and_not_moving = ["and", "r", ["not", "moving"]]
guard = ["and", "r_and_not_moving", ["once", "moving"]]

# `never_published` has no place in outputs, so its verdict is computed and
# kept. Replacing the default set is how a file says which verdicts matter.
[properties.guard_holds]
check = ["and", "guard", "rhs"]

[properties.guard_holds.where]
rhs = ["or", "moving", "r"]

[properties.never_published]
check = ["once", "r"]

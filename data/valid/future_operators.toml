#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# Every future-time operator: next, eventually, always and until. A document
# may hold past-time and future-time properties side by side; what may not be
# mixed is the two cones inside one rule.
[[monitors]]
inputs = ["request", "grant", "shutdown"]
outputs = ["grant_follows_request", "no_grant_before_shutdown", "quiet_after_shutdown"]

[variables]
request = { type = "bool" }
grant = { type = "bool" }
shutdown = { type = "bool" }

[rules]
stays_quiet = ["always", ["not", "grant"]]

[properties.grant_follows_request]
given = "request"
check = ["eventually", "grant", { max = 20 }]

[properties.no_grant_before_shutdown]
check = ["until", ["not", "grant"], ["next", "shutdown"]]

[properties.quiet_after_shutdown]
given = "shutdown"
check = "stays_quiet"

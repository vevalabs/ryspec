#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# The anonymous namespace may share a document with named ones. The root and
# `south` below both declare a rule named `interlock`; they are two names
# rather than one, and a [monitors] list tells them apart by the prefix the
# root does not carry.
#
# The root is the one namespace that may nest others: it holds the rule
# `interlock`, the property `arm_safe` and the nested namespace `south` side by
# side, which no named namespace may.
#
# The value space does not divide that way. `[variables]` is the document's,
# reached from the root and from `south` alike, so `arm_moving` below is one
# column read by two namespaces and is declared once.
[monitors.default]
inputs = ["arm_moving", "door_open"]
outputs = ["arm_safe", "south.door_interlock"]

[variables]
arm_moving = { type = "bool", description = "the arm is under power" }
door_open = { type = "bool", description = "the cell door is open" }

[rules]
interlock = ["not", "arm_moving"]

[properties.arm_safe]
check = ["historically", "interlock"]

[namespace.south.rules]
interlock = ["not", ["and", "door_open", "arm_moving"]]

[namespace.south.properties.door_interlock]
check = ["historically", "interlock"]

#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# `[extras]` is the document's free-form table: any key, any TOML value, nested
# as deep as a tool likes. An `extras` table, here or on a namespace, property or
# variable, is the only place a TOML datetime is accepted, because it is the
# only place the format reads nothing. Without it a tool would
# have to put its settings under a namespace name.
[extras]
generated = 2026-09-25T10:30:00Z
reviewed_on = 2026-09-01
revision = 7

[extras.acme-runner]
workers = 4
tags = ["nightly", { lane = "fast" }]

# A variable has an `extras` table of its own, whatever its `type`.
[variables.heartbeat]
description = "pulse from the controller"

[variables.heartbeat.extras]
signal = "CTRL_HB"
last_calibrated = 2026-08-14

[properties.stays_alive]
check = "heartbeat"

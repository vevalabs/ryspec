#:schema ../../schemas/v0/ryspec.schema.json
#:expect-grammar-error

# An infix comparison sits in braces and takes a variable on the left and a
# variable or a number on the right, exactly as its prefix spelling does.
# Neither side is a formula, so a parenthesised expression cannot stand in one.
version = "0"

[properties.p_holds]
check = "({speed > (gear and brake)})"

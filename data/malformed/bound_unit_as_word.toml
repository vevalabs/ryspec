#:schema ../../schemas/v0/ryspec.schema.json
#:expect-grammar-error

# A bound's unit is its third field, after a second colon: `[3:10:s]`. A word
# after the upper end, `[3:10 s]`, has no field to fill.
version = "0"

[variables]
ack = { type = "bool" }

[properties.p1]
check = "(once[3:10 s] {ack})"

#:schema ../../schemas/v0/ryspec.schema.json
#:expect-grammar-error

# A unit says what a bound's ends count, so a bound giving a unit gives an
# end, as in prefix form. `[::s]` has a unit and nothing for it to count.
version = "0"

[variables]
ack = { type = "bool" }

[properties.p1]
check = "(once[::s] {ack})"

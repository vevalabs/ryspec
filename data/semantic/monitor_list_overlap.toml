#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# Rule 1: a name in two of one monitor's lists at once.

[monitors.default]
inputs = ["speed"]
outputs = ["p"]
parameters = ["speed"]

[variables]
speed = { type = "number", initial_value = 10 }

[properties.p]
check = ["gt", "speed", { value = 0 }]

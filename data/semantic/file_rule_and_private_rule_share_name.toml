#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# Rule 11, two rules: [namespace.<ns>.properties.<name>.where] is a boundary
# between properties, not a shadow over [namespace.<ns>.rules]. A private
# 'helper' beside a file-level one leaves the name ambiguous inside the
# property that declares it.

[[monitors]]
inputs = ["p"]
outputs = ["helper_holds"]

[variables]
p = { type = "bool" }

[rules]
helper = ["once", "p"]

[properties.helper_holds]
check = "helper"

[properties.helper_holds.where]
helper = ["always", "p"]

#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# Rule 12, verdict form: a name resolving to a property reaches its verdict,
# which is what its 'check' computes -- so the verdict carries that rule's
# cone into wherever the property is named.

[[monitors]]
inputs = ["p"]
outputs = ["backward", "mixed"]

[variables]
p = { type = "bool" }

[properties.backward]
check = ["once", "p"]

[properties.mixed]
check = ["always", "backward"]

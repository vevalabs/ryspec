#:schema ../../schemas/v0/ryspec.schema.json
version = "0"

# Rule 11, rule and input: 'guard' arrives as an input and is also computed by
# a file-level rule. A rule reads the input and the rule alike as `guard`,
# and an input already carries a value -- so the rule is a second source for
# it, and `guard` no longer says which it means.

[[monitors]]
inputs = ["p", "guard"]
outputs = ["guard_holds"]

[variables]
p = { type = "bool" }
guard = { type = "bool" }

[rules]
guard = ["not", "p"]

[properties.guard_holds]
check = "guard"

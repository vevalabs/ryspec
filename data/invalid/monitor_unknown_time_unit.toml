#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error 'msec' is not valid

# A monitor's time unit is one of the units a bound takes: ns, us, ms, s, min
# and h.
version = "0"

[[monitors]]
inputs = ["p"]
outputs = ["p_seen"]

[monitors.runtime]
time_unit = "msec"

[properties.p_seen]
check = ["once", "p", { max = 10 }]

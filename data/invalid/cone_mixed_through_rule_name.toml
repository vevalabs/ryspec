#:schema ../../schemas/v0/ryspec.schema.json
#:expect-semantic-error looks to the future and 'looks_back' is a past-time rule

# Every rule sits in one time cone, and a name does not hide which. Written
# out as ["always", ["once", "p"]] the schema rejects this; behind the name
# `looks_back` the mixing is only visible once the name is resolved.
version = 0

[monitor]
inputs = ["p"]
outputs = ["mixed"]

[variables]
p = { type = "bool" }

[rules]
looks_back = ["once", "p"]

[[properties]]
name = "mixed"
check = ["always", "looks_back"]

#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error ['gt', 'speed'] is too short

# A comparison takes exactly three items: the operator, the variable it reads
# and the name or literal it compares against. There is nothing here for `speed` to be
# greater than.
version = "0"

[properties.p]
check = ["gt", "speed"]

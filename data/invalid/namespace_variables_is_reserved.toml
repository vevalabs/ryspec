#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error should not be valid under {}

# `variables` is a document-root key, and it is reserved in every namespace too.
# Otherwise it would be read as a nested namespace under one that holds no
# logic, where any other name is accepted.
version = "0"

[a.variables.rules]
r = "x"

[a.variables.properties.p]
check = "r"

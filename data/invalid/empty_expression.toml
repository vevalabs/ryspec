#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error '()' is not valid

# An expression is a parenthesised formula, and a pair of parentheses with
# nothing in them is not one. It is not a name either -- the other spelling a
# rule can take in this position -- which is the branch the report lands on.
version = "0"

[properties.p]
check = "()"

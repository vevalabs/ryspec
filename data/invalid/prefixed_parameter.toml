#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error does not match

# A variable is named bare everywhere, by the name it is declared under. `@`
# is part of no name, so `limit` names nothing.
version = "0"

[monitors.default]
inputs = ["speed"]
outputs = ["p"]
parameters = ["@limit"]

[variables]
speed = { type = "number" }
limit = { type = "number", initial_value = 3 }

[properties.p]
check = ["gt", "speed", "limit"]

#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error ['contains', 'label', {'value': 'a'}, {'value': 'b'}] is too long

# A string comparison has two operands, and `contains` checks for one
# substring at a time.
version = "0"

[properties.p]
check = ["contains", "label", { value = "a" }, { value = "b" }]

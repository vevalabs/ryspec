#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error ('montiors' was unexpected)

# The document root is closed: `version`, `meta`, `variables`, `monitors`,
# `properties` and `extras`, and nothing else. Namespaces live under
# `properties`, so a misspelled or retired root key is refused as the stray
# key it is.
version = "0"

[montiors]
inputs = ["p"]
outputs = ["q"]

[properties.q]
check = "p"

#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error ('causality' was unexpected)

# A `variables` entry says nothing about which partition a name is in -- that
# is decided solely by the monitors' lists, so there is no key restating it
# and the two can never disagree. FMI's `causality` has no counterpart here.
version = "0"

[monitors.default]
inputs = ["speed"]
outputs = ["p"]

[variables]
speed = { type = "number", causality = "input" }

[properties.p]
check = ["gt", "speed", { value = 0 }]

#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error ('causality' was unexpected)

# A [variables] entry says nothing about which partition a name is in -- that
# is decided solely by the [monitor] lists, so there is no key restating it and
# the two can never disagree. FMI's `causality` has no counterpart here.
version = 0

[monitor]
inputs = ["speed"]
outputs = ["p"]

[variables]
speed = { type = "number", causality = "input" }

[[properties]]
name = "p"
check = ["gt", "speed", 0]

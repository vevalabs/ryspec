#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error 'sometimes' is not valid

# The operator picks out which of the rule shapes applies, so a name that is
# not one of them matches no shape at all. `sometimes` is spelt `once` looking
# backward and `eventually` looking forward.
version = "0"

[properties.p]
check = ["sometimes", "q"]

#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error has non-unique elements

# A partition list's order is that partition's order, so a name appears in it
# once. Listing `speed` twice would claim two input slots for one variable.
version = "0"

[[monitors]]
inputs = ["speed", "speed"]
outputs = ["p"]

[variables]
speed = { type = "number" }

[properties.p]
check = ["gt", "speed", { value = 0 }]

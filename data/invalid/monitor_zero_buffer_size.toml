#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error 0 is less than the minimum of 1

# A buffer that holds no sample buffers nothing, so a buffer size is at least 1.
version = "0"

[monitors.default]
outputs = ["p"]

[monitors.default.runtime]
buffer_size = 0

[properties.p]
check = "q"

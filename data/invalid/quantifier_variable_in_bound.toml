#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error {'qvar': 's'} is not valid
version = "0"

# A metric bound is fixed before the run -- a number or a parameter -- and a
# quantifier variable follows the trace, so it cannot size one.
# A bound names a parameter bare, so `{ qvar = "s" }` is refused by the schema
# itself.
[properties.p1]
check = ["forall", ["once", ["assign", "sensor_id", { qvar = "s" }], { max = { qvar = "s" } }], { qvars = ["s"] }]

#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error does not match

# Every name in inputs and parameters is a plain identifier. The qualified
# <property>.<rule> form is the one exception and belongs to outputs alone --
# see ../valid/private_rules.toml.
version = 0

[monitor]
inputs = ["vehicle.speed"]
outputs = ["p"]

[[properties]]
name = "p"
check = "q"

#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error ('b' was unexpected)

# Logic sits in the leaves. A namespace holding `rules`, `properties` or
# `extras` holds no nested namespace, so `a` below may declare `interlock` or
# may hold `a.b`, and not both. The document root is the one exception: it is
# the anonymous namespace and the parent of the named ones at once.
version = "0"

[variables]
door_open = { type = "bool", description = "the cell door is open" }

[namespace.a.rules]
interlock = ["not", "door_open"]

[namespace.a.b.rules]
also_interlock = ["not", "door_open"]

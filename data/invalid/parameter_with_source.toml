#:schema ../../schemas/v0/ryspec.schema.json
#:expect-semantic-error may not declare source

# Only an input carries a source: an output is computed and a parameter is set
# before the run. A `variables` entry says nothing about its partition, so the
# schema cannot see which list `threshold` is in -- the loader can.
version = "0"

[monitors.default]
inputs = ["speed"]
outputs = ["p"]
parameters = ["threshold"]

[variables]
speed = { type = "number" }
threshold = { type = "number", source = "speed", initial_value = 5 }

[properties.p]
check = ["gt", "speed", "threshold"]

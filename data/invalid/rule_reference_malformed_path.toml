#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error ['not', 'plant..arm_idle'] is not valid

# A rule reference is a dotted path of identifiers. An empty segment names no
# namespace, so `plant..arm_idle` is refused rather than read as `plant.arm_idle`.
version = "0"

[plant.rules]
arm_idle = "arm_moving"

[properties.p]
check = ["not", "plant..arm_idle"]

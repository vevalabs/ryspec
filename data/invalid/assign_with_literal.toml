#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error 'qvar' is a required property

# `assign` gives a quantified variable the value of a name. A literal is not
# a quantified variable, and comparing with one is what `eq` is for.
version = "0"

[properties.p]
check = ["forall", ["assign", "sensor_id", { value = 3 }], { qvars = ["s"] }]

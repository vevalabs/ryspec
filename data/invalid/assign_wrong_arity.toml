#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error ['forall', ['assign', 'sensor_id', {'qvar': 's'}, {'qvar': 'r'}]

# `assign` gives one quantified variable the value of one name. Two variables
# is two assignments, not one assignment with a third operand.
version = "0"

[properties.p]
check = ["forall", ["assign", "sensor_id", { qvar = "s" }, { qvar = "r" }], { qvars = ["s", "r"] }]

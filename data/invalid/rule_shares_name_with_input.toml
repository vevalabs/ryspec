#:schema ../../schemas/v0/ryspec.schema.json
#:expect-semantic-error more than one source of value

# A rule names a variable, a rule and a property alike, bare, so a name means
# one thing in the whole document. `guard` names an input, which already
# carries a value, and a rule that computes one -- two sources, one name, and
# no way to tell which `check = "guard"` reads.
version = "0"

[[monitors]]
inputs = ["p", "guard"]
outputs = ["guard_holds"]

[variables]
p = { type = "bool" }
guard = { type = "bool" }

[rules]
guard = ["not", "p"]

[properties.guard_holds]
check = "guard"

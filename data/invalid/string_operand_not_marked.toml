#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error ['eq', 'label', 'sensor 7'] is not valid

# An unmarked operand is a variable reference, and `sensor 7` is not one. The text it means is
# written `{ value = "sensor 7" }`.
version = "0"

[properties.p]
check = ["eq", "label", "sensor 7"]

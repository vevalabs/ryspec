#:schema ../../../schemas/v0/ryspec.schema.json
#:expect-semantic-error min (30) is greater than max (2)

# A binary operator carries its bound in the fourth position rather than the
# third, and the ends are checked there too. A window from 30 steps back to 2
# steps back is empty.
version = 0

[[properties]]
name = "p_holds"
check = ["since", "p", "q", { min = 30, max = 2 }]

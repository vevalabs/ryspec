#:schema ../../../schemas/v0/ryspec.schema.json
#:expect-schema-error {'max': 3} is not of type 'string', 'array'

# The bound is the last item, after both operands. Placed third it sits where
# the operand that ends the stretch belongs.
version = "0"

[properties.p_holds]
check = ["until", "p", { max = 3 }, "q"]

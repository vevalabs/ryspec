#:schema ../../../schemas/v0/ryspec.schema.json
#:expect-semantic-error min (30) is greater than max (2)

# The same check, in the forward cone: each end is well-formed on its own, so
# the schema sees nothing wrong, and it is the two together that are empty.
version = "0"

[properties.p_holds]
check = ["until", "p", "q", { min = 30, max = 2 }]

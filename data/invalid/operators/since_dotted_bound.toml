#:schema ../../../schemas/v0/ryspec.schema.json
#:expect-schema-error ['since', 'p', 'q', {'max': 'limits.max'}] is not valid

# A bound's end is a number or a plain identifier naming a parameter. The
# dotted form belongs to a [monitor] output and reaches nothing from here.
version = 0

[[properties]]
name = "p_holds"
check = ["since", "p", "q", { max = "limits.max" }]

#:schema ../../../schemas/v0/ryspec.schema.json
#:expect-schema-error ['since', 'p', 'q', {'max': 'limits.max'}] is not valid

# A bound's end is a number or a parameter, named bare. A dotted path names a
# rule or a property in a namespace, and neither sizes a bound.
version = "0"

[properties.p_holds]
check = ["since", "p", "q", { max = "limits.max" }]

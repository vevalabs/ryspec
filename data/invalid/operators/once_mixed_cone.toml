#:schema ../../../schemas/v0/ryspec.schema.json
#:expect-semantic-error 'once' looks to the past

# Every rule sits in one time cone, and `once` looks backward, so its operand
# is a past-time rule. Asking whether something will eventually hold was once
# true of the past is not a question this logic has -- though the schema, which
# settles shape alone, no longer says so.
version = "0"

[properties.p_holds]
check = ["once", ["eventually", "p"]]

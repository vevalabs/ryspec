#:schema ../../schemas/v0/ryspec.schema.json
#:expect-schema-error 0 is less than the minimum of 1

# A runtime with nothing allocated holds nothing, so an allocation size is at
# least 1.
version = "0"

[monitors.default]
outputs = ["p"]

[monitors.default.runtime]
allocation_size = 0

[properties.p]
check = "q"
